<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="header-title header-desc">
  <title id="header-title">Muhammad Abdullah — Software Engineering and Computer Engineering</title>
  <desc id="header-desc">A dark violet banner with the name Muhammad Abdullah, the title Software Engineering · Computer Engineering, and the tagline Systems programming · Infrastructure · Applied AI.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E0A16"/>
      <stop offset="1" stop-color="#09070E"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#C4B5FD" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 60) rotate(90) scale(320)">
      <stop stop-color="#7C3AED" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="88" y1="114" x2="620" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F3FF"/>
      <stop offset="0.6" stop-color="#D8CCFF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="accent" x1="88" y1="0" x2="128" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="hairline" x1="88" y1="0" x2="1112" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .orbit-slow { transform-box: view-box; transform-origin: 1010px 121px; animation: orbit 36s linear infinite; }
    .orbit-reverse { transform-box: view-box; transform-origin: 1010px 121px; animation: orbit-reverse 54s linear infinite; }
    .core { animation: core-pulse 8s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
    @keyframes core-pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) {
      .orbit-slow, .orbit-reverse, .core { animation: none; }
    }
  </style>

  <rect width="1200" height="260" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="19.5" stroke="url(#border)"/>
  <rect width="1200" height="260" rx="20" fill="url(#glow)"/>

  <g fill="none" stroke="#8B5CF6">
    <circle cx="1010" cy="121" r="51" stroke-opacity="0.42"/>
    <circle cx="1010" cy="121" r="84" stroke-opacity="0.24"/>
    <circle cx="1010" cy="121" r="117" stroke-opacity="0.12"/>
  </g>
  <circle class="core" cx="1010" cy="121" r="3.5" fill="#C4B5FD"/>
  <g class="orbit-slow">
    <circle cx="1094" cy="121" r="2.6" fill="#A78BFA"/>
  </g>
  <g class="orbit-reverse">
    <circle cx="1010" cy="4" r="2.2" fill="#8B5CF6"/>
  </g>

  <rect x="88" y="74" width="40" height="2" rx="1" fill="url(#accent)"/>

  <text x="88" y="136" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="600" letter-spacing="-1" fill="url(#name)">Muhammad Abdullah</text>
  <text x="90" y="176" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#A78BFA">SOFTWARE ENGINEERING &#183; COMPUTER ENGINEERING</text>
  <text x="90" y="207" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#918AA3" letter-spacing="0.3">Systems programming &#183; Infrastructure &#183; Applied AI</text>

  <rect x="88" y="234" width="1024" height="1" fill="url(#hairline)"/>
</svg>
